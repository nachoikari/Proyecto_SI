<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TicoPay — Asistente Virtual</title>
<style>
  :root { --navy:#0B1B3A; --amber:#F5A623; --gray:#F2F3F5; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Arial,sans-serif; background:var(--gray); color:#1a1a1a; }
  .wrap { max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
  header { background:var(--navy); color:#fff; padding:14px 18px; }
  header b { font-size:1.1rem; }
  header span { opacity:.7; font-size:.8rem; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { padding:10px 13px; border-radius:12px; max-width:82%; line-height:1.4; white-space:pre-wrap; }
  .bot { background:#fff; align-self:flex-start; border:1px solid #e3e3e3; }
  .yo  { background:var(--navy); color:#fff; align-self:flex-end; }
  form { display:flex; gap:8px; padding:12px; background:#fff; border-top:1px solid #e3e3e3; }
  input { flex:1; padding:11px; border:1px solid #ccc; border-radius:10px; font-size:1rem; }
  button { padding:11px 16px; border:0; border-radius:10px; background:var(--amber); font-weight:700; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<div class="wrap">
  <header><b>TicoPay</b> &nbsp;<span>Asistente Virtual</span></header>
  <div id="chat">
    <div class="msg bot">¡Hola! Soy el asistente de TicoPay. ¿En qué le puedo ayudar?</div>
  </div>
  <form id="f">
    <input id="in" placeholder="Escribí tu mensaje..." autocomplete="off" required>
    <button id="b">Enviar</button>
  </form>
</div>
<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('f');
  const input = document.getElementById('in');
  const boton = document.getElementById('b');

  function burbuja(texto, clase) {
    const d = document.createElement('div');
    d.className = 'msg ' + clase;
    d.textContent = texto;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const mensaje = input.value.trim();
    if (!mensaje) return;
    burbuja(mensaje, 'yo');
    input.value = '';
    boton.disabled = true;
    const esperando = burbuja('…', 'bot');
    try {
      const r = await fetch('/.netlify/functions/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mensaje }),
      });
      const data = await r.json();
      esperando.textContent = data.respuesta || '(sin respuesta)';
    } catch (err) {
      esperando.textContent = 'Error de conexión.';
    }
    boton.disabled = false;
    input.focus();
  });
</script>
</body>
</html>
